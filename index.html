<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dumpling Coin Hunt 🥟</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-wrapper">
    <header>
      <h1>🥟 Dumpling Coin Hunt</h1>
      <p class="subtitle">A coin is hiding inside one of the dumplings. Can you find it?</p>
    </header>

    <div class="stats-bar">
      <div class="stat">
        <span class="stat-label">Score</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Round</span>
        <span class="stat-value" id="round">1</span>
      </div>
      <div class="stat">
        <span class="stat-label">Best</span>
        <span class="stat-value" id="best">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Tries Left</span>
        <span class="stat-value" id="tries">3</span>
      </div>
    </div>

    <div class="bowl-container" id="bowl-container" aria-label="Bowl of dumplings"></div>

    <div class="message-box" id="message-box">
      <span id="message-text">Pick a dumpling to find the coin!</span>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="new-game-btn">New Game</button>
    </div>

    <div class="hint-bar" id="hint-bar"></div>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="overlay-card">
      <div class="overlay-icon" id="overlay-icon"></div>
      <h2 id="overlay-title"></h2>
      <p id="overlay-msg"></p>
      <button class="btn btn-primary" id="overlay-btn">Play Again</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
